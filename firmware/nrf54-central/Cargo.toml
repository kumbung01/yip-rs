[package]
name = "yip-nrf54-central"
version = "0.1.0"
edition = "2024"

# Keep each firmware's dependency features and build output independent.
[workspace]

[dependencies]
yip = { path = "../..", default-features = false, features = ["nrf54lm20", "defmt"] }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = ["nrf54lm20-app-s", "gpiote", "unstable-pac", "time"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }

[profile.dev]
opt-level = 2

[profile.release]
debug = 2

[patch."https://github.com/embassy-rs/embassy.git"]
embassy-nrf = { path = "C:/git/rust/embassy/embassy-nrf" }
embassy-time = { path = "C:/git/rust/embassy/embassy-time" }
embassy-sync = { path = "C:/git/rust/embassy/embassy-sync" }
embassy-futures = { path = "C:/git/rust/embassy/embassy-futures" }
embassy-executor = { path = "C:/git/rust/embassy/embassy-executor" }
