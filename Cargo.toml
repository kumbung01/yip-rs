[package]
name = "yip"
version = "0.1.0"
edition = "2024"

[[example]]
name = "test"
required-features = ["nrf52840", "defmt"]

[dependencies]
yip-macros = { path = "yip-macros" }
cortex-m = "0.7"
defmt = { version = "1", optional = true }

embassy-time = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = [
    "gpiote",
    "unstable-pac",
    "time",
] }
critical-section = "1"
bitfield-struct = "0.13"
nonmax = { version = "0.5.5", default-features = false }
fixed = "1.28.0"
static_cell = "2.1"
paste = "1.0"

[dev-dependencies]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", branch = "main", features = [
    "platform-cortex-m",
    "executor-thread",
] }
cortex-m-rt = "0.7.5"
defmt-rtt = "1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }


[features]
default = ["nrf52840"]

nrf52840 = ["embassy-nrf/nrf52840"]
nrf54lm20 = [
    "embassy-nrf/nrf54lm20-app-s",
    "embassy-nrf/time-driver-grtc",
]
# nRF54LM20 peripheral: keep RRAM in standby while waiting for connected RX.
reduce-rram-latency = []
defmt = ["dep:defmt"]

[profile.dev]
opt-level = 2

[profile.release]
debug = 2


[patch."https://github.com/embassy-rs/embassy.git"]
embassy-nrf = { path = "C:/git/rust/embassy/embassy-nrf" }
embassy-time = { path = "C:/git/rust/embassy/embassy-time" }
embassy-sync = { path = "C:/git/rust/embassy/embassy-sync" }
embassy-futures = { path = "C:/git/rust/embassy/embassy-futures" }
embassy-executor = { path = "C:/git/rust/embassy/embassy-executor" }
