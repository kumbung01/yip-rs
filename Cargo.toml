[package]
name = "yip"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { version = "1", optional = true }


embassy-sync = { version = "0.8" }
embassy-futures = { version = "0.1" }
embassy-nrf = { version = "0.11", features = [
    "nrf52840",
    "unstable-pac",
    "time",
], }
critical-section = "1"
bitfield-struct = "0.13"
nonmax = {
    version = "0.5.5",
    default-features = false,
}
fixed = "1.28.0"
static_cell = "2.1"

[dev-dependencies]
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
cortex-m-rt = "0.7.5"
defmt-rtt = "1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }

[features]
defmt = ["dep:defmt"]

[profile.release]
debug = 2
